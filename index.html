<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gladix</title>
<!--
  Home page of the Gladix GitHub Pages site (rschwertley.github.io/gladix/). It replaces a JetBrains
  inspection export that had been committed here by accident (6608f68f, 2026-06-08).
  NO EXTERNAL REQUESTS and NO STORE LINKS, as on o/index.html: everything is inline, and "Get Gladix"
  points at GitHub Releases, the same repo the in-app updater reads (R.string.app_github_repo).
  The site also serves o/ (share links) and privacy-policy; keep both working.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7fb;
    --card: #ffffff;
    --text: #1b1520;
    --muted: #6b6172;
    --line: #e7e0ea;
    --accent: #c2185b;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141017;
      --card: #1e1822;
      --text: #f2ecf5;
      --muted: #a396ad;
      --line: #2e2634;
      --accent: #ff4d8d;
      --accent-text: #2a0013;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 24px 24px;
    text-align: center;
  }
  h1 { margin: 0 0 8px; font-size: 28px; }
  p { margin: 0 0 24px; color: var(--muted); }
  .button {
    display: block;
    padding: 12px 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
  }
  .small { display: inline-block; margin-top: 16px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main class="card">
  <h1>Gladix</h1>
  <p>A personal Android music player, a fork of Echo.</p>
  <a class="button" href="https://github.com/rschwertley/gladix/releases">Get Gladix on GitHub</a>
  <a class="small" href="privacy-policy">Privacy policy</a>
</main>
</body>
</html>
