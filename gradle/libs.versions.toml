[versions]
agp = "9.3.2"
kotlin = "2.4.10"
# NOTE: Detekt bundles its OWN Kotlin analyzer for PSI parsing; 1.23.8 bundles ~Kotlin 2.0.x, while this
# project is on Kotlin 2.4.10. PSI-only analysis of ordinary code (incl. reified generics / @OptIn) works,
# but files using brand-new 2.4-only SYNTAX may report a parse error for that file (NOT a hang — detekt is a
# batch parser, so it still completes and analyzes the rest). If you hit such parse errors, bump to the
# newest Detekt release that lists Kotlin 2.4 support.
detekt = "1.23.8"

car-app = "1.7.0"
androidx-paging = "3.5.1"
room = "3.0.2"
sqlite = "2.7.0"
firebase-bom = "34.18.0"
koinAndroid = "4.2.2"
media3 = "1.11.0"
# Cast. NOT version.ref'd to media3: play-services-cast-framework has its own release train,
# and media3-cast 1.11.0 declares 22.3.1 (which in turn hard-pins play-services-cast to
# [22.3.1] - a RANGE, so that one must not be declared here or the pin fights the catalogue).
play-services-cast = "22.3.1"
# ⚠️ DO NOT GO BELOW 3.6.0. It ships a shrinker rule inside coil-core that this app needs:
#   -keep class * extends coil3.target.GenericViewTarget { *; }
# Without it, R8 9.0+ vertically merges GenericViewTarget into its subclasses and SILENTLY DROPS the
# super calls to Target's default interface methods - the override still runs, but the side effect it
# delegates (ImageView.setImageDrawable) never does. Images come out BLANK, minified builds only
# (google/issuetracker 524864608, coil-kt/coil#3518). We hit three call sites: ImageUtils.loadInto and
# loadRoundedInto, which feed the TV full-screen album art (PlayerTvFragment) and the TV mini-player art
# (MainActivity), plus every feed/history/queue row. The phone full-screen cover is NOT affected - that
# goes through loadWithThumb's lambda target, which is not a GenericViewTarget.
#
# WHY THIS WAS NEVER REPORTED, and worth knowing before dismissing a similar report in future: R8's
# vertical class merging is an OPTIMIZATION DECISION, not a deterministic transform. Whether it merges
# any given class depends on the whole-program reachability graph, so the bug appears and disappears
# between builds with no pattern a user could describe. "TV album art was blank in one build and fine in
# the next" is exactly what this looks like from outside, and is exactly the shape of report that gets
# written off as a fluke. It is not a fluke; it is this.
coil = "3.6.1"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version = "1.11.0" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

androidx-car-app = { module = "androidx.car.app:app", version.ref = "car-app" }
androidx-core-google-shortcuts = { module = "androidx.core:core-google-shortcuts", version = "1.1.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.8.0" }
androidx-activity = { group = "androidx.activity", name = "activity", version = "1.13.0" }

protobuf-java = { module = "com.google.protobuf:protobuf-java", version = "4.36.1" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
swiperefresh = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version = "1.2.0" }

fragment = { module = "androidx.fragment:fragment", version = "1.9.0" }

splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
palette = { module = "androidx.palette:palette-ktx", version = "1.0.0" }
material = { group = "com.google.android.material", name = "material", version = "1.14.0" }

preference = { module = "androidx.preference:preference-ktx", version = "1.2.1" }

paging-common = { module = "androidx.paging:paging-common-ktx", version.ref = "androidx-paging" }
paging-runtime = { module = "androidx.paging:paging-runtime-ktx", version.ref = "androidx-paging" }

filekache = { module = "com.mayakapps.kache:file-kache", version = "2.1.1" }

room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-async = { module = "androidx.sqlite:sqlite-async", version.ref = "sqlite" }

koin-androidx-startup = { module = "io.insert-koin:koin-androidx-startup", version.ref = "koinAndroid" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koinAndroid" }
koin-androidx-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koinAndroid" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
play-services-cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version.ref = "play-services-cast" }

coil = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

junit = { module = "junit:junit", version = "4.13.2" }

zxing-core = { module = "com.google.zxing:core", version = "3.5.4" }

pikolo = { module = "com.github.madrapps:pikolo", version = "2.0.2" }
fadingedgelayout = { module = "com.github.bosphere.android-fadingedgelayout:fadingedgelayout", version = "1.0.0" }
fastscroll = { module = "me.zhanghai.android.fastscroll:library", version = "1.3.0" }
nestedscrollwebview = { module = "com.telefonica:nestedscrollwebview", version = "0.2.0" }
acsbendi-webview = { module = "com.github.acsbendi:Android-Request-Inspector-WebView", version = "1.0.12" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

[bundles]
androidx = [
    "androidx-core-ktx", "androidx-appcompat", "androidx-activity", "fragment",
    "recyclerview", "swiperefresh",
    "splashscreen", "palette",
    "preference",
    "androidx-core-google-shortcuts"
]
paging = ["paging-common", "paging-runtime"]
room = ["room-runtime"]
koin = ["koin-androidx-startup", "koin-android", "koin-androidx-workmanager"]
media3 = ["media3-exoplayer", "media3-session", "media3-ui", "media3-dash", "media3-hls"]
coil = ["coil", "coil-gif", "coil-svg", "coil-network-okhttp"]
kotlinx = ["kotlinx-serialization-json", "kotlinx-coroutines-core"]
firebase = ["firebase-analytics", "firebase-crashlytics"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.3.9" }
gms = { id = "com.google.gms.google-services", version = "4.5.0" }
crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.8" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
